services:
  web:
    build: .
    container_name: cashevide-fastapi-web
    env_file:
      - .env
    networks:
      - proxy-network
      - cashevide_default
    restart: unless-stopped

  fastapi-redis:
    image: redis:alpine
    container_name: cashevide-fastapi-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD"'
    restart: unless-stopped

networks:
  proxy-network:
    external: true
  cashevide_default:
    external: true
